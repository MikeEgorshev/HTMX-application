{% extends "base.html" %}

{% block title %}Вход - TODO App{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; padding-top: 4rem;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 2rem;">Вход</h1>
        
        <div id="message-area"></div>
        
        <form hx-post="/api/login" 
              hx-target="#message-area" 
              hx-swap="innerHTML"
              hx-indicator="#login-spinner">
            
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       required 
                       autocomplete="username"
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       required 
                       autocomplete="current-password">
            </div>

            <button type="submit" style="width: 100%;">
                <span id="login-spinner" class="htmx-indicator">⏳ </span>
                Войти
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-dim);">
            Нет аккаунта? 
            <a href="/register" style="color: var(--primary); text-decoration: none;">
                Зарегистрироваться
            </a>
        </p>
    </div>
</div>
{% endblock %}
