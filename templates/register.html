{% extends "base.html" %}

{% block title %}Регистрация - TODO App{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; padding-top: 4rem;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 2rem;">Регистрация</h1>
        
        <div id="message-area"></div>
        
        <form hx-post="/api/register" 
              hx-target="#message-area" 
              hx-swap="innerHTML"
              hx-indicator="#register-spinner">
            
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       required 
                       minlength="3"
                       autocomplete="username"
                       autofocus>
                <small style="color: var(--text-dim); font-size: 0.75rem;">
                    Минимум 3 символа
                </small>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       required 
                       minlength="8"
                       autocomplete="new-password">
                <small style="color: var(--text-dim); font-size: 0.75rem;">
                    Минимум 8 символов
                </small>
            </div>

            <button type="submit" style="width: 100%;">
                <span id="register-spinner" class="htmx-indicator">⏳ </span>
                Зарегистрироваться
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-dim);">
            Уже есть аккаунт? 
            <a href="/login" style="color: var(--primary); text-decoration: none;">
                Войти
            </a>
        </p>
    </div>
</div>
{% endblock %}
